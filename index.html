<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>送给芊芊</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="content">
    <h1 id="title">🌌 送给芊芊 🌌</h1>
    <p id="countdown"></p>
    <div id="text"></div>
    <div class="heart"></div>

    <div class="msg-section">
      <h3>💬 留言给芊芊</h3>
      <textarea id="msgInput" placeholder="写下想说的话..."></textarea><br/>
      <button onclick="saveMessage()">保存留言</button>
      <div id="savedMsg"></div>
    </div>
  </div>

  <audio id="music" src="assets/perfect.mp3" loop></audio>
  <audio id="voice" src="assets/voice.mp3"></audio>

  <script src="bg.js"></script>
  <script src="script.js"></script>
</body>
</html>
